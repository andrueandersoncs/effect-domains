global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yaml

scrape_configs:
  - job_name: effect-domains-telemetry
    static_configs:
      - targets: ["collector:8889"]
  - job_name: otel-collector
    static_configs:
      - targets: ["collector:8888"]
